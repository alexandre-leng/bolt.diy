<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>__TITLE__ · Bolt</title>
<style>
  :root { color-scheme: light dark; --ink:#16181d; --muted:#5d6370; --line:#dfe2e8; --bg:#f6f7f9;
          --card:#fff; --accent:#4f46e5; --accent-ink:#fff; --err:#b42318; --err-bg:#fef3f2;
          --ok:#067647; --ok-bg:#ecfdf3; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#f4f4f5; --muted:#a1a1aa; --line:#2b2b31; --bg:#0f0f12; --card:#18181b;
            --accent:#8b7bff; --accent-ink:#101014; --err:#fda29b; --err-bg:#2a1416;
            --ok:#75e0a7; --ok-bg:#0f2418; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         color:var(--ink); background:var(--bg); }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line);
         border-radius:16px; padding:32px 28px;
         box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06); }
  main.wide { max-width:760px; }
  h1 { margin:0 0 6px; font-size:1.375rem; letter-spacing:-.01em; }
  p.sub { margin:0 0 24px; color:var(--muted); font-size:.9375rem; }
  label { display:block; font-weight:600; font-size:.875rem; margin:0 0 6px; }
  .field { margin-bottom:16px; }
  input[type=text], input[type=email], input[type=password] {
    width:100%; height:44px; padding:0 12px; font:inherit; color:inherit; background:var(--card);
    border:1px solid var(--line); border-radius:10px; }
  input:focus-visible, button:focus-visible, a:focus-visible {
    outline:2px solid var(--accent); outline-offset:2px; }
  .pw { position:relative; } .pw input { padding-right:48px; }
  .toggle { position:absolute; top:2px; right:2px; width:40px; height:40px; border:0; border-radius:8px;
            background:transparent; color:var(--muted); cursor:pointer; display:grid; place-items:center; }
  .toggle:hover { background:rgba(127,127,127,.12); color:var(--ink); }
  .toggle svg { width:20px; height:20px; }
  .toggle svg[hidden] { display:none; }
  .submit { width:100%; height:44px; margin-top:8px; border:0; border-radius:10px; font:inherit;
            font-weight:600; color:var(--accent-ink); background:var(--accent); cursor:pointer; }
  .submit[disabled] { opacity:.6; cursor:progress; }
  .msg { margin:0 0 16px; padding:10px 12px; border-radius:10px; font-size:.9rem; }
  .msg.err { color:var(--err); background:var(--err-bg); border:1px solid color-mix(in srgb, var(--err) 35%, transparent); }
  .msg.ok { color:var(--ok); background:var(--ok-bg); border:1px solid color-mix(in srgb, var(--ok) 35%, transparent); }
  .check { display:flex; gap:10px; align-items:flex-start; margin-bottom:12px; font-size:.9rem; }
  .check input { margin-top:3px; }
  .check label { font-weight:400; margin:0; }
  .links { margin:20px 0 0; font-size:.9rem; display:flex; flex-wrap:wrap; gap:14px; }
  a { color:var(--accent); }
  .hint { color:var(--muted); font-size:.82rem; margin:6px 0 0; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); }
  th { font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .row-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .btn-sm { border:1px solid var(--line); background:transparent; color:inherit; border-radius:8px;
            padding:5px 10px; font:inherit; font-size:.82rem; cursor:pointer; }
  .btn-sm:hover { background:rgba(127,127,127,.1); }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:.75rem;
           border:1px solid var(--line); }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  header.bar { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:20px; }
  header.bar nav { display:flex; gap:14px; font-size:.9rem; flex-wrap:wrap; }
  @media (max-width:520px) { header.bar { flex-direction:column; align-items:flex-start; } }
</style>
</head>
<body>
<main class="__WIDTH__">
__BODY__
</main>
<script>
// Show/hide toggle for every password field on the page. Label is localised in French and
// announced to screen readers, as required for the app's password fields.
document.querySelectorAll('.pw').forEach(function (wrap) {
  var input = wrap.querySelector('input');
  var btn = wrap.querySelector('.toggle');
  if (!input || !btn) return;
  var on = btn.querySelector('.on'), off = btn.querySelector('.off');
  btn.addEventListener('click', function () {
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    var label = show ? 'Masquer le mot de passe' : 'Afficher le mot de passe';
    btn.setAttribute('aria-pressed', String(show));
    btn.setAttribute('aria-label', label);
    btn.title = label;
    if (on) on.toggleAttribute('hidden', show);
    if (off) off.toggleAttribute('hidden', !show);
    input.focus();
  });
});
</script>
</body>
</html>

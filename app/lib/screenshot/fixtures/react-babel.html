er-events:none}.cta>*{position:relative}.cta .eyebrow{margin-bottom:8px}.cta h2{font-size:38px;font-weight:700;letter-spacing:-1.2px;line-height:1.1;margin:0}.cta .pill{background:white;color:#080808;border-color:white;min-width:185px}.overlay{position:fixed;inset:0;background:#0008;z-index:50;display:grid;place-items:center;padding:20px;backdrop-filter:blur(5px)}.modal{position:relative;background:#fff;border-radius:18px;padding:36px;max-width:540px;width:100%;max-height:90vh;overflow:auto}.modal h2{font-size:32px;line-height:1.1;font-weight:700;margin:15px 0}.modal p{line-height:1.6;color:#555}.close{position:absolute;right:15px;top:10px;font-size:28px;background:none;border:0}.modal label{display:block;margin:15px 0 6px;font-size:14px}.modal input,.modal textarea{border:1px solid #bbb;border-radius:7px;padding:10px;width:100%;font:inherit}.modal textarea{height:100px}.modal form .pill{margin-top:20px}.modal img{width:100%;max-height:240px;object-fit:cover;border-radius:8px}@media(min-width:1200px){.hero{min-height:550px}.hero-image{height:550px}.hero h1{font-size:clamp(76px,7.4vw,112px)}.hero-copy{padding-top:55px}.hero p{max-width:430px;font-size:18px;line-height:25px}.about-copy{display:flex;flex-direction:column;align-items:flex-start;justify-content:center}.about,.about-image{min-height:400px}.project img{height:210px}}@media(max-width:800px){.header{height:70px}.nav{gap:18px;margin-left:0}.hero h1{font-size:57px;letter-spacing:-3px}.hero-copy{padding-top:38px}.hero p{font-size:14px}.actions{gap:8px;flex-wrap:wrap}.pill{padding:11px 19px}.services{gap:20px}.service:nth-child(n){padding-left:0}.service p{white-space:normal}.about-copy{padding:30px 7%}.about h2{font-size:34px}.about p{font-size:14px}.work h2{font-size:32px}.cta h2{font-size:30px}.cta{padding:25px;gap:20px}.project p{font-size:11px}}@media(max-width:600px){.header{padding:0 6%}.nav{display:none}.hero{grid-template-columns:1fr}.hero-copy{padding:35px 6%}.hero h1{font-size:64px;letter-spacing:-3.5 </style></head><body><div id="root"></div><script type="text/babel">const {useState}=React;
const images={hero:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1400&q=90',about:'https://images.unsplash.com/photo-1487958449943-2429e8be8625?auto=format&fit=crop&w=1100&q=90',aura:'https://images.unsplash.com/photo-1608571423902-eed4a5ad8108?auto=format&fit=crop&w=700&q=90',terral:'https://images.unsplash.com/photo-1449158743715-0a90ebb6d2d8?auto=format&fit=crop&w=700&q=90',lumi:'https://images.unsplash.com/photo-1440404653325-ab127d49abc1?auto=format&fit=crop&w=700&q=90'};
const projects=[{name:'AURA',desc:'Branding, Product Design, Web',image:images.aura},{name:'TERRAL',desc:'Brand Strategy, Web, Development',image:images.terral},{name:'LUMI',desc:'Branding, Web, Growth',image:images.lumi}];
function Icon({type}){return <svg viewBox="0 0 36 36" fill="currentColor" aria-hidden="true">{type===0?<path d="M24 0 5 22h12l-4 14 19-22H20z"/>:type===1?<><path d="m18 1 17 9-17 9L1 10z"/><path d="m2 16 16 8 16-8v5l-16 8-16-8zM2 24l16 8 16-8v4l-16 8-16-8z"/></>:type===2?<><circle cx="13" cy="10" r="6.5"/><circle cx="26" cy="11" r="5"/><path d="M0 31v-4c0-12 25-12 25 0v4zm26 0v-5c0-4-2-7-4-9 9-2 14 4 14 10v4z"/></>:<><rect x="2" y="20" width="8" height="13" rx="1.5"/><rect x="14" y="12" width="8" height="21" rx="1.5"/><rect x="26" y="4" width="8" height="29" rx="1.5"/></>}</svg>}
function App(){const [modal,setModal]=useState(null),[sent,setSent]=useState(false);function contact(){setSent(false);setModal('contact')}return <div className="page"><header className="header" id="home"><a className="logo" href="#home">NOVA</a><nav className="nav"><a href="#home">Home</a><a href="#work">Work</a><a href="#about">About</a><a href="#blog" onClick={e=>{e.preventDefault();setModal('blog')}}>Blog</a><a href="#contact" onClick={e=>{e.preventDefault();contact()}}>Contact</a></nav><button className="pill" onClick={contact}>Get Started</button></header><main><section className="hero"><div className="hero-copy"><div className="eyebrow">BOLDER IDEAS. BRIGHTER BRANDS.</div><h1>Design<br/>for a more<br/>human web.</h1><p>We're a creative studio helping ambitious businesses build brands, products, and experiences people love.</p><div className="actions"><button className="pill" onClick={contact}>Let's Work Together</button><a className="pill outline" href="#work">See Our Work</a></div></div><img className="hero-image" src={images.hero} alt="Sunlight over dramatic Himalayan mountain peaks"/></section><section className="services">{[['Strategy','Clear direction for','bigger opportunities.'],['Design','Beautiful, functional','brand experiences.'],['Development','Scalable products','built for real users.'],['Growth','Ongoing support','to help you scale.']].map((s,i)=><article className="service" key={s[0]}><Icon type={i}/><h3>{s[0]}</h3><p>{s[1]}<br/>{s[2]}</p></article>)}</section><section className="about" id="about"><img className="about-image" src={images.about} alt="Sculptural white architecture against a blue sky"/><div className="about-copy"><div className="eyebrow">ABOUT NOVA</div><h2>A creative partner<br/>for what’s next.</h2><p>We combine strategy, design, and technology to help brands make a meaningful impact. Our work is driven by curiosity, grounded in collaboration, and built for what’s next.</p><button className="pill" onClick={()=>setModal('story')}>Our Story</button></div></section><section className="work" id="work"><div className="work-heading"><div><div className="eyebrow">FEATURED WORK</div><h2>Real brands. Real impact.</h2></div><button className="all" onClick={()=>setModal('projects')}>View All Projects <span>→</span></button></div><div className="projects">{projects.map(p=><button className="project" key={p.name} onClick={()=>setModal(p)}><img src={p.image} alt={p.name+' brand project'}/><div className="project-info"><div><h3>{p.name}</h3><p>{p.desc}</p></div><span className="arrow">→</span></div></button>)}</div></section><section className="cta" id="contact"><div><div className="eyebrow">READY TO BUILD SOMETHING BOLDER?</div><h2>Let’s create what’s next.</h2></div><button className="pill" onClick={contact}>Start a Conversation</button></section></main>{modal&&<div className="overlay" onClick={()=>setModal(null)}><section className="modal" role="dialog" aria-modal="true" aria-label="NOVA details" onClick={e=>e.stopPropagation()}><button className="close" aria-label="Close dialog" onClick={()=>setModal(null)}>×</button>{modal==='contact'?<><div className="eyebrow">LET'S WORK TOGETHER</div><h2>Let’s create what’s next.</h2>{sent?<p>Thank you! Your message has been received. We’re excited to hear about your project.</p>:<form onSubmit={e=>{e.preventDefault();setSent(true)}}><label htmlFor="name">Your name</label><input id="name" required/><label htmlFor="email">Email address</label><input id="email" type="email" required/><label htmlFor="message">Tell us about your project</label><textarea id="message" required/><button className="pill" type="submit">Send Message →</button></form>}</>:modal==='story'?<><div className="eyebrow">ABOUT NOVA</div><h2>A creative partner for what’s next.</h2><p>We combine strategy, design, and technology to help brands make a meaningful impact. Our work is driven by curiosity, grounded in collaboration, and built for what’s next.</p><button className="pill" onClick={contact}>Let's Work Together</button></>:modal==='blog'?<><div className="eyebrow">NOVA JOURNAL</div><h2>Bolder ideas. Brighter brands.</h2><p>Thoughts on strategy, design, development, and growth. New stories are coming soon.</p></>:modal==='projects'?<><div className="eyebrow">OUR WORK</div><h2>Real brands. Real impact.</h2>{projects.map(p=><button className="project" style={{width:'100%',marginTop:20}} key={p.name} onClick={()=>setModal(p)}><img src={p.image} alt={p.name}/><h3>{p.name} →</h3><p>{p.desc}</p></button>)}</>:<><img src={modal.image} alt={modal.name}/><h2>{modal.name}</h2><p>{modal.desc}</p><button className="pill" onClick={contact}>Build something with us →</button></>}</section></div>}</div>};ReactDOM.createRoot(document.getElementById('root')).render(<App/>);document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('.close')?.click()});</script></body></html>
